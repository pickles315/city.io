<!DOCTYPE html>
<html>
<head>
    <meta charset="UTF-8">
    <title>WebGL Test</title>

    <style>
        html, body {
            margin: 0;
            width: 100%;
            height: 100%;
            overflow: hidden;
            background: #222;
            font-family: Arial;
        }

        canvas {
            width: 100%;
            height: 100%;
            display: block;
        }

        #status {
            position: fixed;
            top: 15px;
            left: 15px;
            padding: 15px;
            background: black;
            color: white;
            font-size: 18px;
            z-index: 10;
            border-radius: 8px;
            white-space: pre-line;
        }
    </style>
</head>

<body>

<div id="status">Starting WebGL...</div>
<canvas id="canvas"></canvas>

<script>
const status = document.getElementById("status");
const canvas = document.getElementById("canvas");

function show(text) {
    status.textContent = text;
}

try {

    show("Creating WebGL context...");

    const gl = canvas.getContext("webgl");

    if (!gl) {
        show(
            "❌ WEBGL FAILED\n\n" +
            "ChromeOS/Chrome did not provide WebGL."
        );

        throw new Error("WebGL unavailable");
    }

    show("✅ WebGL works!\n\nCreating shader...");

    const vertexShader = gl.createShader(gl.VERTEX_SHADER);

    gl.shaderSource(vertexShader, `
        attribute vec3 position;

        void main() {
            gl_Position = vec4(position, 1.0);
        }
    `);

    gl.compileShader(vertexShader);

    if (!gl.getShaderParameter(vertexShader, gl.COMPILE_STATUS)) {
        show(
            "❌ VERTEX SHADER ERROR\n\n" +
            gl.getShaderInfoLog(vertexShader)
        );

        throw new Error("Vertex shader failed");
    }

    show("✅ WebGL works!\n\nVertex shader works!\n\nCreating fragment shader...");

    const fragmentShader = gl.createShader(gl.FRAGMENT_SHADER);

    gl.shaderSource(fragmentShader, `
        precision mediump float;

        void main() {
            gl_FragColor = vec4(1.0, 0.2, 0.1, 1.0);
        }
    `);

    gl.compileShader(fragmentShader);

    if (!gl.getShaderParameter(fragmentShader, gl.COMPILE_STATUS)) {
        show(
            "❌ FRAGMENT SHADER ERROR\n\n" +
            gl.getShaderInfoLog(fragmentShader)
        );

        throw new Error("Fragment shader failed");
    }

    show("✅ WebGL works!\n\nShaders work!\n\nCreating triangle...");

    const program = gl.createProgram();

    gl.attachShader(program, vertexShader);
    gl.attachShader(program, fragmentShader);

    gl.linkProgram(program);

    if (!gl.getProgramParameter(program, gl.LINK_STATUS)) {
        show(
            "❌ PROGRAM LINK ERROR\n\n" +
            gl.getProgramInfoLog(program)
        );

        throw new Error("Program failed");
    }

    gl.useProgram(program);

    const vertices = new Float32Array([
         0.0,  0.7, 0.0,
        -0.7, -0.7, 0.0,
         0.7, -0.7, 0.0
    ]);

    const buffer = gl.createBuffer();

    gl.bindBuffer(gl.ARRAY_BUFFER, buffer);
    gl.bufferData(
        gl.ARRAY_BUFFER,
        vertices,
        gl.STATIC_DRAW
    );

    const position =
        gl.getAttribLocation(program, "position");

    gl.enableVertexAttribArray(position);

    gl.vertexAttribPointer(
        position,
        3,
        gl.FLOAT,
        false,
        0,
        0
    );

    function resize() {
        const dpr = window.devicePixelRatio || 1;

        canvas.width =
            window.innerWidth * dpr;

        canvas.height =
            window.innerHeight * dpr;

        gl.viewport(
            0,
            0,
            canvas.width,
            canvas.height
        );
    }

    window.addEventListener("resize", resize);

    resize();

    function render() {

        gl.clearColor(
            0.05,
            0.1,
            0.2,
            1
        );

        gl.clear(gl.COLOR_BUFFER_BIT);

        gl.drawArrays(
            gl.TRIANGLES,
            0,
            3
        );

        requestAnimationFrame(render);
    }

    show(
        "🟢 WEBGL IS WORKING!\n\n" +
        "You should see a RED triangle.\n\n" +
        "If you see this message + triangle,\n" +
        "your Chromebook is NOT the problem."
    );

    render();

} catch (error) {

    show(
        "❌ SOMETHING FAILED\n\n" +
        error.message
    );

}
</script>

</body>
</html>
