<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>My City Builder</title>

<style>
html, body {
    margin: 0;
    width: 100%;
    height: 100%;
    overflow: hidden;
    background: #87ceeb;
}

canvas {
    width: 100%;
    height: 100%;
    display: block;
}

#ui {
    position: fixed;
    top: 15px;
    left: 15px;
    padding: 12px 16px;
    background: rgba(0,0,0,.75);
    color: white;
    font-family: Arial, sans-serif;
    border-radius: 8px;
}
</style>
</head>

<body>

<div id="ui">
    🏙️ My City Builder<br>
    <small>City Grid</small>
</div>

<canvas id="canvas"></canvas>

<script>

const canvas = document.getElementById("canvas");
const gl = canvas.getContext("webgl");

if (!gl) {
    document.getElementById("ui").textContent =
        "WebGL is not available";
    throw new Error("WebGL unavailable");
}


/* =========================
   SHADERS
========================= */

const vertexShaderSource = `
attribute vec3 position;

uniform float rotation;

void main() {

    float c = cos(rotation);
    float s = sin(rotation);

    float x = position.x * c - position.z * s;
    float z = position.x * s + position.z * c;

    gl_Position = vec4(
        x * 0.12,
        position.y * 0.12,
        z * 0.06 - 0.45,
        1.0
    );
}
`;

const fragmentShaderSource = `
precision mediump float;

uniform vec4 color;

void main() {
    gl_FragColor = color;
}
`;


function createShader(type, source) {

    const shader = gl.createShader(type);

    gl.shaderSource(shader, source);
    gl.compileShader(shader);

    return shader;
}


const vertexShader =
    createShader(
        gl.VERTEX_SHADER,
        vertexShaderSource
    );

const fragmentShader =
    createShader(
        gl.FRAGMENT_SHADER,
        fragmentShaderSource
    );


const program = gl.createProgram();

gl.attachShader(program, vertexShader);
gl.attachShader(program, fragmentShader);

gl.linkProgram(program);
gl.useProgram(program);


/* =========================
   POSITION
========================= */

const position =
    gl.getAttribLocation(
        program,
        "position"
    );

const rotation =
    gl.getUniformLocation(
        program,
        "rotation"
    );

const color =
    gl.getUniformLocation(
        program,
        "color"
    );


/* =========================
   GRID
========================= */

const gridSize = 20;
const tileSize = 2;

const vertices = [];


/*
    Each tile is a thin square.
*/

for (let x = 0; x < gridSize; x++) {

    for (let z = 0; z < gridSize; z++) {

        const x1 =
            (x - gridSize / 2) * tileSize;

        const z1 =
            (z - gridSize / 2) * tileSize;

        const x2 =
            x1 + tileSize;

        const z2 =
            z1 + tileSize;

        // Top
        vertices.push(
            x1, 0, z1,
            x2, 0, z1,
            x2, 0, z2,

            x1, 0, z1,
            x2, 0, z2,
            x1, 0, z2
        );
    }
}


/* =========================
   BUFFER
========================= */

const buffer = gl.createBuffer();

gl.bindBuffer(
    gl.ARRAY_BUFFER,
    buffer
);

gl.bufferData(
    gl.ARRAY_BUFFER,
    new Float32Array(vertices),
    gl.STATIC_DRAW
);

gl.enableVertexAttribArray(position);

gl.vertexAttribPointer(
    position,
    3,
    gl.FLOAT,
    false,
    0,
    0
);


/* =========================
   RESIZE
========================= */

function resize() {

    const dpr =
        window.devicePixelRatio || 1;

    canvas.width =
        window.innerWidth * dpr;

    canvas.height =
        window.innerHeight * dpr;

    gl.viewport(
        0,
        0,
        canvas.width,
        canvas.height
    );
}

window.addEventListener(
    "resize",
    resize
);

resize();


/* =========================
   RENDER
========================= */

let angle = 0;

function render() {

    gl.clearColor(
        0.45,
        0.65,
        0.85,
        1
    );

    gl.clear(
        gl.COLOR_BUFFER_BIT
    );

    /*
        Slightly rotate the entire
        city so you can see the grid.
    */
    angle = -0.35;

    gl.uniform1f(
        rotation,
        angle
    );

    /*
        Green city ground
    */
    gl.uniform4f(
        color,
        0.18,
        0.55,
        0.22,
        1
    );

    gl.drawArrays(
        gl.TRIANGLES,
        0,
        vertices.length / 3
    );


    requestAnimationFrame(render);
}

render();

</script>

</body>
</html>
